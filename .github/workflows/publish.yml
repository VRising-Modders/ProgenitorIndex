name: Publish index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check entries (shape only)
        run: node tools/validate.mjs --offline

      - name: Build index.json
        env:
          INDEX_CACHE_DIR: ${{ runner.temp }}/index-cache
        run: node tools/build-index.mjs

      - name: Sign index.json
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          if [ -z "$INDEX_SIGNING_KEY" ]; then
            echo "::error::The INDEX_SIGNING_KEY secret is not set; refusing to publish an unsigned index."
            exit 1
          fi
          node tools/sign.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
